const GOOGLE_CALENDAR_SCOPE='https://www.googleapis.com/auth/calendar.events.readonly';

function allEvents(){return [...(state.events||[]),...googleEvents].sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.start||'').localeCompare(b.start||''))}
function googleButton(){const b=document.getElementById('googleConnectBtn');if(!b)return;const active=Boolean(googleAccessToken&&googleExpiresAt>Date.now());b.classList.toggle('connected',active);b.textContent=active?'✓ Google Agenda connecté':'📅 Connecter Google Agenda';b.title=active?'Cliquer pour actualiser les événements':'Connexion Google en lecture seule';}
function showGoogleError(msg){googleCalendarStatus=msg;toast(msg);render()}
async function loadGoogleEvents(){
 if(!googleAccessToken||googleExpiresAt<=Date.now()){googleAccessToken=null;googleEvents=[];googleButton();showGoogleError('La connexion a expiré. Clique sur « Connecter Google Agenda ».');return}
 googleCalendarStatus='Synchronisation de Google Agenda en cours…';googleButton();
 try{
  const from=new Date();from.setMonth(from.getMonth()-12);
  const to=new Date();to.setMonth(to.getMonth()+18);
  let next='',all=[],count=0;
  do{
   const params=new URLSearchParams({timeMin:from.toISOString(),timeMax:to.toISOString(),singleEvents:'true',orderBy:'startTime',maxResults:'250',fields:'nextPageToken,items(id,summary,start,end,status,htmlLink)'});
   if(next)params.set('pageToken',next);
   const response=await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events?'+params.toString(),{headers:{Authorization:'Bearer '+googleAccessToken},cache:'no-store'});
   if(response.status===401){googleAccessToken=null;googleEvents=[];googleButton();throw Error('Session Google expirée. Reconnecte-toi pour actualiser le calendrier.')}
   if(!response.ok){const error=await response.json().catch(()=>({}));throw Error(error.error?.message||`Google Calendar : erreur ${response.status}`)}
   const data=await response.json();all.push(...(data.items||[]));next=data.nextPageToken||'';count++;
  }while(next&&count<25);
  googleEvents=all.filter(e=>e.status!=='cancelled'&&e.start).map(e=>({id:'google:'+e.id,title:e.summary||'(Sans titre)',date:(e.start.date||e.start.dateTime||'').slice(0,10),start:e.start.dateTime?new Date(e.start.dateTime).toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit',hour12:false}):'',end:e.end?.dateTime?new Date(e.end.dateTime).toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit',hour12:false}):'',type:'Google Agenda',url:e.htmlLink||''}));
  googleCalendarStatus=`✓ ${googleEvents.length} événements importés depuis Google Agenda. Lecture seule.`;
  render();toast(`${googleEvents.length} événements Google Agenda synchronisés ♡`);
 }catch(e){showGoogleError('Impossible de lire Google Agenda : '+e.message)}
}
function connectGoogleCalendar(){
 if(!window.google?.accounts?.oauth2){showGoogleError('La connexion Google ne se charge pas. Actualise la page, puis réessaie.');return}
 if(googleAccessToken&&googleExpiresAt>Date.now()){loadGoogleEvents();return}
 if(!googleTokenClient){googleTokenClient=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:GOOGLE_CALENDAR_SCOPE,callback:async resp=>{
   if(resp.error){showGoogleError('Google a refusé la connexion : '+(resp.error_description||resp.error));return}
   if(!resp.access_token){showGoogleError('Aucun accès Google reçu.');return}
   googleAccessToken=resp.access_token;googleExpiresAt=Date.now()+(Number(resp.expires_in||3600)*1000)-30000;
   await loadGoogleEvents();
 },error_callback:e=>{if(e.type!=='popup_closed')showGoogleError('La fenêtre de connexion Google a été fermée ou bloquée.')}})}
googleTokenClient.requestAccessToken({prompt:''});
}

function clone(o){return JSON.parse(JSON.stringify(o))}
function load(){try{const s=localStorage.getItem(KEY);if(s){let d=JSON.parse(s);if(Array.isArray(d.tasks)&&Array.isArray(d.study)&&Array.isArray(d.events))return {...clone(BASE),...d}}}catch(e){}return clone(BASE)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Stockage local indisponible : utilise Exporter pour conserver tes données.')}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(d,options={day:'numeric',month:'short'}){if(!d)return 'Sans date';return new Date(d+'T12:00:00').toLocaleDateString('fr-CA',options)}
function iso(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function now(){return new Date()}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast._id);toast._id=setTimeout(()=>t.style.display='none',2800)}
function courseChip(c){return `<span class="course-chip" style="background:${COURSE_COLORS[c]||'#eee'}">${esc(c)}</span>`}
function percent(n,d){return d?Math.round(n/d*100):0}
function doneTasks(){return state.tasks.filter(t=>t.done).length}
function doneStudy(){return state.study.filter(t=>t.done).length}
function studyDuration(s){const [sh,sm]=(s.start||'0:0').split(':').map(Number),[eh,em]=(s.end||'0:0').split(':').map(Number);return Math.max(0,((eh*60+em)-(sh*60+sm))/60)}
function taskRow(t){return `<div class="taskrow ${t.done?'done':''}"><input type="checkbox" class="tick" ${t.done?'checked':''} aria-label="Terminer ${esc(t.title)}" data-toggle-task="${esc(t.id)}"><div class="task-main"><div class="task-title">${esc(t.title)}</div><div class="meta">${esc(t.course)} · ${fmtDate(t.date)} · ${esc(t.category||'Tâche')}</div></div>${t.priority==='Haute'?'<span class="tag">★ Priorité</span>':''}</div>`}
function navRender(){document.getElementById('nav').innerHTML=NAV.map(([k,t])=>`<button class="nav-btn ${k===view?'active':''}" data-nav="${k}" title="${t}"><span style="font-size:19px;width:20px">${ICONS[k]}</span><span class="nav-label">${t}</span></button>`).join('')}

function head(title,sub){return `<div class="page-head"><div><div class="overline">YOUR STUDY WEEK AT A GLANCE</div><h1>${title}</h1><p>${sub}</p></div><span style="font-size:26px;color:#cd99a6">✿</span></div>`}
function homeView(){let pending=[...state.tasks].filter(t=>!t.done).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')).slice(0,5);let weekStart=new Date(now());weekStart.setHours(12,0,0,0);weekStart.setDate(weekStart.getDate()-((weekStart.getDay()+6)%7));let dates=Array.from({length:7},(_,i)=>{let d=new Date(weekStart);d.setDate(weekStart.getDate()+i);return {date:iso(d),day:d.toLocaleDateString('fr-CA',{weekday:'short'}),n:d.getDate()}});let dayEvents=allEvents().filter(e=>e.date===chosenDay).slice(0,4);let taskPct=percent(doneTasks(),state.tasks.length),studyPct=percent(doneStudy(),state.study.length);return `${head('Your Dashboard','Ton espace de productivité · Session A2026')}<div class="hero"><img src="${ART}" alt="Illustration chaleureuse d’un bureau d’étude avec tulipes, ordinateur et carnet"><div class="hero-copy"><div class="hero-tag">A LITTLE SPACE TO BREATHE</div><h2>Make space<br>for good work.</h2><p>Une session plus douce, plus organisée et à ton rythme.</p><span class="hero-sticker">✿ une chose à la fois</span></div></div><div class="stat-grid"><div class="stat"><small>Travaux terminés</small><strong>${doneTasks()}/${state.tasks.length}</strong><div class="mini">${taskPct}% de mes tâches</div></div><div class="stat"><small>Étude complétée</small><strong>${doneStudy()}/${state.study.length}</strong><div class="mini">séances planifiées</div></div><div class="stat"><small>Heures étudiées</small><strong>${state.study.filter(s=>s.done).reduce((a,s)=>a+studyDuration(s),0).toFixed(1)} h</strong><div class="mini">+ ${state.focusMinutes} min Pomodoro</div></div><div class="stat"><small>Progression globale</small><strong>${percent(doneTasks()+doneStudy(),state.tasks.length+state.study.length)}%</strong><div class="mini">little by little ♡</div></div></div><div class="grid2"><section class="card"><div class="card-head"><h3>Today · Mes priorités</h3><button class="soft-btn" data-nav="tasks">Voir tout →</button></div><div class="card-sub">Les prochaines choses à terminer</div><div class="task-list">${pending.map(taskRow).join('')||'<div class="empty">Tout est terminé. Bravo ✿</div>'}</div></section><section class="card"><div class="card-head"><h3>This Week</h3><button class="soft-btn" data-nav="calendar">Calendrier →</button></div><div class="card-sub">Cette semaine · clique sur un jour</div><div class="week-days">${dates.map(x=>`<button data-day="${x.date}" class="week-day ${chosenDay===x.date?'selected':''}">${esc(x.day)}<strong>${x.n}</strong></button>`).join('')}</div><div style="margin-top:13px">${dayEvents.map((e,i)=>`<div class="agenda-block ${e.type==='Université'?'blue':e.type==='Personnel'?'pink':''}"><strong>${esc(e.title)}</strong><span>${esc(e.start||'Toute la journée')}${e.end?' – '+esc(e.end):''}</span></div>`).join('')||'<div class="empty">Aucun événement prévu ce jour-là.</div>'}</div></section><section class="card"><div class="card-head"><h3>Focus</h3><div class="timer-options"><button class="selected" data-nav="focus">Pomodoro ↗</button></div></div><div class="card-sub">Concentre-toi sur une seule chose</div><div class="focus-circle" style="--pct:${studyPct}%"><div class="focus-content"><strong>${studyPct}%</strong><small>des séances complétées</small></div></div><div style="text-align:center"><button class="primary" data-nav="focus">◷ Démarrer un focus</button></div></section><section class="card"><div class="card-head"><h3>Notes</h3><button class="soft-btn" data-nav="notes">+ Ajouter</button></div><div class="notes-grid">${state.notes.slice(0,3).map(n=>`<div class="note ${esc(n.color||'yellow')}"><strong>${esc(n.title)}</strong><p>${esc(n.body)}</p></div>`).join('')}</div></section></div><div class="ribbon"><div><small>A LITTLE REMINDER</small><strong>Progress counts, always.</strong></div><span style="font-size:40px">☁ ✿</span></div>`}
function tasksView(){let courses=['Tous','COM3126','COM3070','MKG3330','MKG5333','Perso'];let filtered=state.tasks.filter(t=>(taskCourse==='Tous'||t.course===taskCourse)&&(taskStatus==='Toutes'||(taskStatus==='À faire'?!t.done:t.done))&&(`${t.title} ${t.course} ${t.category}`).toLowerCase().includes(taskQuery.toLowerCase())).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));return `${head('Mes tâches','Cocher, organiser, ajouter et modifier mes travaux')}<div class="card"><div class="toolbar"><input class="field" id="taskSearch" placeholder="⌕  Rechercher une tâche..." value="${esc(taskQuery)}"><select id="statusFilter"><option ${taskStatus==='Toutes'?'selected':''}>Toutes</option><option ${taskStatus==='À faire'?'selected':''}>À faire</option><option ${taskStatus==='Terminées'?'selected':''}>Terminées</option></select><button class="primary" data-add="task">+ Nouvelle tâche</button></div><div class="course-selects">${courses.map(c=>`<button data-course="${c}" class="${taskCourse===c?'active':''}">${esc(c)}</button>`).join('')}</div><div class="table-wrap" style="margin-top:17px"><table class="data-table"><thead><tr><th>Fait</th><th>Travail / étape</th><th>Cours</th><th>Échéance</th><th>Priorité</th><th>Actions</th></tr></thead><tbody>${filtered.map(t=>`<tr class="${t.done?'done':''}"><td><input class="tick" type="checkbox" data-toggle-task="${esc(t.id)}" ${t.done?'checked':''}></td><td><div class="task-title">${esc(t.title)}</div><div class="meta">${esc(t.category||'')}</div></td><td>${courseChip(t.course)}</td><td>${fmtDate(t.date)}</td><td><span class="tag">${esc(t.priority||'Moyenne')}</span></td><td><div class="actions"><button class="icon-btn" title="Modifier" data-edit="${esc(t.id)}">✎</button><button class="icon-btn" title="Supprimer" data-delete="${esc(t.id)}">×</button></div></td></tr>`).join('')}</tbody></table>${!filtered.length?'<div class="empty">Aucune tâche pour ce filtre.</div>':''}</div></div>`}
function calendarView(){let y=dateCursor.getFullYear(),m=dateCursor.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,last=new Date(y,m+1,0).getDate(),cells=[];for(let i=0;i<42;i++){let d=new Date(y,m,i-offset+1),date=iso(d),isOut=d.getMonth()!==m,ev=allEvents().filter(e=>e.date===date),ts=state.tasks.filter(t=>t.date===date),ss=state.settings.showStudyOnCalendar?state.study.filter(s=>s.date===date):[];cells.push(`<div class="cal-day ${isOut?'out':''} ${date===iso(new Date())?'today':''}"><span class="num">${d.getDate()}</span>${ts.slice(0,2).map(t=>`<span class="cal-item" title="${esc(t.title)}">${t.done?'✓ ':'✦ '}${esc(t.title)}</span>`).join('')}${ev.slice(0,2).map(e=>`<span class="cal-item event" title="${esc(e.title)}">${esc(e.title)}</span>`).join('')}${ss.slice(0,1).map(s=>`<span class="cal-item study" title="${esc(s.title)}">◷ ${esc(s.course)}</span>`).join('')}${ev.length+ts.length+ss.length>5?`<span style="font-size:9px;color:#999">+ autre</span>`:''}</div>`)}return `${head('Calendrier','Échéances, cours, travail et séances d’étude au même endroit')}<div class="card"><div class="cal-head"><button class="ghost" data-month="-1">←</button><h3 style="margin:0;text-align:center">${first.toLocaleDateString('fr-CA',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase())}</h3><div><button class="ghost" data-month="0">Aujourd'hui</button> <button class="ghost" data-month="1">→</button></div></div><div class="google-info">${esc(googleCalendarStatus||"Google Agenda non connecté. Clique sur « Connecter Google Agenda » en haut à droite.")}<small>Lecture seule · Calendrier principal · La connexion sera à renouveler après fermeture/expiration de la session.</small></div><div class="cal-grid">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(x=>`<div class="cal-weekday">${x}</div>`).join('')}${cells.join('')}</div><div class="legend"><span><b style="background:#fff0bf"></b>Échéances</span><span><b style="background:#f8e4e6"></b>Événements</span><span><b style="background:#e5edff"></b>Étude</span><label style="margin-left:auto"><input type="checkbox" id="showStudy" ${state.settings.showStudyOnCalendar?'checked':''}> Afficher les séances d'étude</label></div><div class="footnote">Clique sur « Connecter Google Agenda » en haut pour afficher tes événements privés. Ils sont lus en temps réel et ne sont ni intégrés au site public ni enregistrés dans ton navigateur. Ton suivi de tâches reste sauvegardé localement.</div></div>`}
function focusView(){let pending=state.study.filter(s=>!s.done),done=state.study.filter(s=>s.done).length;return `${head('Focus time','25 minutes pour avancer, une pause pour souffler')}<div class="grid2"><section class="card"><div class="card-head"><h3>Pomodoro</h3><div class="timer-options">${[[25,'Focus'],[5,'Pause'],[15,'Longue']].map(([v,t])=>`<button data-mode="${v}" class="${focusMode===v?'selected':''}">${t}</button>`).join('')}</div></div><div class="focus-circle" id="timerCircle"><div class="focus-content"><strong id="timerText">25:00</strong><small>${focusMode===25?'Se concentrer':'Prendre une pause'}</small></div></div><div class="timer-controls"><button class="ghost" id="resetTimer">↺ Réinitialiser</button><button class="round-btn" id="runTimer">${running?'Ⅱ':'▶'}</button></div><select id="focusCourse" class="timer-course">${['COM3126','COM3070','MKG3330','MKG5333','Perso'].map(c=>`<option ${focusCourse===c?'selected':''}>${c}</option>`).join('')}</select><div class="card-sub" style="text-align:center">Une session de 25 minutes terminée s'enregistre automatiquement.</div></section><section class="card"><div class="card-head"><h3>Mes blocs d'étude</h3><span class="tag">${done}/${state.study.length} faits</span></div><div class="card-sub">Coche une séance quand tu l'as complétée.</div><div class="task-list" style="max-height:420px;overflow:auto">${pending.slice(0,9).map(s=>`<div class="taskrow"><input type="checkbox" class="tick" data-toggle-study="${esc(s.id)}"><div class="task-main"><div class="task-title">${esc(s.title)}</div><div class="meta">${esc(s.course)} · ${fmtDate(s.date)} · ${esc(s.start)}–${esc(s.end)}</div></div></div>`).join('')||'<div class="empty">Toutes tes séances sont terminées ♡</div>'}</div></section></div><div class="ribbon"><div><small>TON TEMPS INVESTI</small><strong>${state.focusMinutes} min de focus enregistrées · ${state.focusSessions} session(s)</strong></div>✿</div>`}
function statsView(){let total=state.tasks.length+state.study.length,finished=doneTasks()+doneStudy(),pct=percent(finished,total),courses=['COM3126','COM3070','MKG3330','MKG5333'];let bars=courses.map(c=>{let tasks=state.tasks.filter(t=>t.course===c),sessions=state.study.filter(s=>s.course===c),den=tasks.length+sessions.length,n=tasks.filter(t=>t.done).length+sessions.filter(t=>t.done).length;return `<div class="barrow"><strong>${c}</strong><div class="bar-track"><div class="bar-fill" style="width:${percent(n,den)}%;background:${COURSE_COLORS[c]}"></div></div><small>${n}/${den}</small></div>`}).join('');let categories=[...new Set(state.tasks.map(t=>t.category))];return `${head('Mes statistiques','Une vue claire de ta progression')}<div class="stat-grid"><div class="stat"><small>Tâches terminées</small><strong>${doneTasks()}</strong><div class="mini">sur ${state.tasks.length}</div></div><div class="stat"><small>Étude faite</small><strong>${doneStudy()}</strong><div class="mini">sur ${state.study.length} séances</div></div><div class="stat"><small>Pomodoros</small><strong>${state.focusSessions}</strong><div class="mini">${state.focusMinutes} minutes</div></div><div class="stat"><small>Avancement total</small><strong>${pct}%</strong><div class="mini">tâches + étude</div></div></div><div class="charts"><section class="card"><h3>Globalement</h3><div class="card-sub">Ce qui est fait et ce qui reste</div><div class="donut" style="--d:${pct}%"><div class="donut-inner"><div><strong>${pct}%</strong><div class="meta">terminé</div></div></div></div><div style="text-align:center;color:#8a7b87">${finished} éléments faits · ${total-finished} à faire</div></section><section class="card"><h3>Par cours</h3><div class="card-sub">Tâches et séances d'étude complétées</div>${bars}</section><section class="card"><h3>Par type de travail</h3><div class="card-sub">Répartition des ${state.tasks.length} tâches</div>${categories.map(c=>{let n=state.tasks.filter(t=>t.category===c).length;return `<div class="barrow"><strong style="font-size:11px">${esc(c)}</strong><div class="bar-track"><div class="bar-fill" style="width:${percent(n,state.tasks.length)}%"></div></div><small>${n}</small></div>`}).join('')}</section><section class="card"><h3>Temps consacré</h3><div class="card-sub">Étude et Pomodoro</div><div style="font:600 40px Georgia,serif;margin:24px 0;color:#86616b">${(state.study.filter(s=>s.done).reduce((a,s)=>a+studyDuration(s),0)+state.focusMinutes/60).toFixed(1)} h</div><p class="meta">Temps des séances cochées, plus celui des Pomodoros terminés.</p></section></div>`}
function notesView(){return `${head('Mes notes','Idées, rappels et petites choses à ne pas oublier')}<div class="toolbar"><button class="primary" data-add="note">+ Nouvelle note</button></div><div class="notes-grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${state.notes.map(n=>`<div class="note ${esc(n.color||'yellow')}" style="min-height:150px"><button data-delete-note="${esc(n.id)}" title="Supprimer">×</button><strong>${esc(n.title)}</strong><p>${esc(n.body)}</p><button style="top:auto;bottom:10px;font-size:12px" data-edit-note="${esc(n.id)}">Modifier ✎</button></div>`).join('')}</div>`}
function settingsView(){return `${head('Mes données','Ton application conserve tes progrès sur cet appareil')}<div class="grid2"><div class="card"><h3>Sauvegarde automatique</h3><p style="line-height:1.7">Les cases cochées, nouvelles tâches, notes et séances Pomodoro sont enregistrées dans le <strong>stockage local de ce navigateur</strong>. Pas besoin de compte.</p><p class="meta">Pour récupérer tes données sur un autre appareil ou avant d'effacer l'historique du navigateur, télécharge une sauvegarde JSON.</p><div class="toolbar"><button class="primary" id="exportSettings">↓ Exporter une sauvegarde</button><button class="ghost" id="importSettings">↑ Importer</button></div></div><div class="card"><h3>Ta confidentialité</h3><p style="line-height:1.7">Cette version fonctionne sans serveur. Tes données ne sont pas envoyées à un service externe. Elle ne se synchronise pas automatiquement avec Google Agenda ou Google Sheets.</p><p class="meta">Aucun événement personnel n’est inclus dans le code public. La synchronisation Google Agenda n’est pas encore activée.</p><button class="ghost" id="resetData">Réinitialiser aux données initiales</button></div></div>`}
function openModal(type,record={}){editId=record.id||null;let note=type==='note',study=type==='study';let fields=note?`<label class="wide">Titre<input name="title" required value="${esc(record.title||'')}"></label><label class="wide">Texte<textarea name="body" rows="5" required>${esc(record.body||'')}</textarea></label><label>Couleur<select name="color">${['yellow','blue','pink','cream'].map(c=>`<option value="${c}" ${record.color===c?'selected':''}>${{yellow:'Jaune',blue:'Bleu',pink:'Rose',cream:'Crème'}[c]}</option>`).join('')}</select></label>`:`<label class="wide">Description de la tâche<input name="title" required value="${esc(record.title||'')}"></label><label>Cours<select name="course">${['COM3126','COM3070','MKG3330','MKG5333','Perso'].map(c=>`<option ${record.course===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Date<input name="date" type="date" required value="${esc(record.date||iso(now()))}"></label><label>Catégorie<select name="category">${['Travail','TP','Présentation','Examen','Révision','Personnel'].map(c=>`<option ${record.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Priorité<select name="priority">${['Haute','Moyenne','Basse'].map(c=>`<option ${record.priority===c?'selected':''}>${c}</option>`).join('')}</select></label>`;
document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><form class="modal" id="editForm"><h2>${note?(editId?'Modifier la note':'Nouvelle note'):(editId?'Modifier ma tâche':'Nouvelle tâche')} ✿</h2><div class="form-grid">${fields}</div><div class="modal-foot"><button type="button" class="ghost" id="closeModal">Annuler</button><button type="submit" class="primary">${editId?'Enregistrer':'Ajouter'}</button></div></form></div>`;document.getElementById('closeModal').onclick=closeModal;document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});document.getElementById('editForm').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target),item={};for(let[k,v]of fd.entries())item[k]=v;let coll=note?'notes':'tasks';if(editId){state[coll]=state[coll].map(x=>x.id===editId?{...x,...item}:x)}else{state[coll].push({id:(note?'n':'t')+Date.now(),...item,...(!note?{done:false}:{})})}persist();closeModal();render();toast('Enregistré ♡')}}
function closeModal(){document.getElementById('modal-root').innerHTML='';editId=null}
function bind(){document.querySelectorAll('[data-nav]').forEach(x=>x.addEventListener('click',()=>{view=x.dataset.nav;render();scrollTo({top:0,behavior:'smooth'})}));document.querySelectorAll('[data-toggle-task]').forEach(x=>x.addEventListener('change',()=>{let t=state.tasks.find(z=>z.id===x.dataset.toggleTask);if(t){t.done=x.checked;t.doneAt=t.done?new Date().toISOString():null;persist();render()}}));document.querySelectorAll('[data-toggle-study]').forEach(x=>x.addEventListener('change',()=>{let t=state.study.find(z=>z.id===x.dataset.toggleStudy);if(t){t.done=x.checked;persist();render()}}));document.querySelectorAll('[data-day]').forEach(x=>x.addEventListener('click',()=>{chosenDay=x.dataset.day;render()}));document.querySelectorAll('[data-month]').forEach(x=>x.addEventListener('click',()=>{let n=+x.dataset.month;if(n===0){dateCursor=new Date()}else dateCursor=new Date(dateCursor.getFullYear(),dateCursor.getMonth()+n,1);render()}));document.querySelectorAll('[data-course]').forEach(x=>x.addEventListener('click',()=>{taskCourse=x.dataset.course;render()}));let s=document.getElementById('taskSearch');if(s){s.addEventListener('input',e=>{taskQuery=e.target.value;let pos=e.target.selectionStart;render();let n=document.getElementById('taskSearch');n.focus();n.setSelectionRange(pos,pos)})}let status=document.getElementById('statusFilter');if(status)status.onchange=e=>{taskStatus=e.target.value;render()};document.querySelectorAll('[data-add]').forEach(x=>x.addEventListener('click',()=>openModal(x.dataset.add)));document.querySelectorAll('[data-edit]').forEach(x=>x.addEventListener('click',()=>openModal('task',state.tasks.find(t=>t.id===x.dataset.edit))));document.querySelectorAll('[data-delete]').forEach(x=>x.addEventListener('click',()=>{if(confirm('Supprimer cette tâche?')){state.tasks=state.tasks.filter(t=>t.id!==x.dataset.delete);persist();render()}}));document.querySelectorAll('[data-delete-note]').forEach(x=>x.addEventListener('click',()=>{if(confirm('Supprimer cette note?')){state.notes=state.notes.filter(n=>n.id!==x.dataset.deleteNote);persist();render()}}));document.querySelectorAll('[data-edit-note]').forEach(x=>x.addEventListener('click',()=>openModal('note',state.notes.find(n=>n.id===x.dataset.editNote))));let show=document.getElementById('showStudy');if(show)show.onchange=e=>{state.settings.showStudyOnCalendar=e.target.checked;persist();render()};document.querySelectorAll('[data-mode]').forEach(x=>x.addEventListener('click',()=>{running=false;focusMode=+x.dataset.mode;timeLeft=focusMode*60;render()}));let ft=document.getElementById('focusCourse');if(ft)ft.onchange=e=>focusCourse=e.target.value;let run=document.getElementById('runTimer');if(run)run.onclick=()=>{running=!running;timerLast=Date.now();drawTimer()};let reset=document.getElementById('resetTimer');if(reset)reset.onclick=()=>{running=false;timeLeft=focusMode*60;drawTimer()};let re=document.getElementById('resetData');if(re)re.onclick=()=>{if(confirm('Effacer les changements enregistrés sur cet appareil et rétablir les données initiales?')){state=clone(BASE);persist();render();toast('Données réinitialisées')}};let ex=document.getElementById('exportSettings');if(ex)ex.onclick=exportData;let im=document.getElementById('importSettings');if(im)im.onclick=()=>document.getElementById('importFile').click()}
function drawTimer(){let el=document.getElementById('timerText'),circle=document.getElementById('timerCircle'),btn=document.getElementById('runTimer');if(el)el.textContent=String(Math.floor(timeLeft/60)).padStart(2,'0')+':'+String(timeLeft%60).padStart(2,'0');if(circle)circle.style.setProperty('--pct',100*(1-timeLeft/(focusMode*60))+'%');if(btn)btn.textContent=running?'Ⅱ':'▶'}
function timerTick(){if(!running)return;let ms=Date.now(),delta=Math.floor((ms-timerLast)/1000);if(delta<1)return;timerLast+=delta*1000;timeLeft=Math.max(0,timeLeft-delta);if(timeLeft===0){running=false;if(focusMode===25){state.focusSessions++;state.focusMinutes+=25;state.focusByCourse=state.focusByCourse||{};state.focusByCourse[focusCourse]=(state.focusByCourse[focusCourse]||0)+25;persist();toast('Pomodoro terminé! Beau travail ♡')}else toast('Ta pause est terminée ✿');}drawTimer()}
function exportData(){let b=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='day-focus-sauvegarde-'+iso(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Sauvegarde téléchargée ♡')}
function importData(file){if(!file)return;let rd=new FileReader();rd.onload=()=>{try{let d=JSON.parse(rd.result);if(!Array.isArray(d.tasks)||!Array.isArray(d.study)||!Array.isArray(d.events))throw Error('Fichier incompatible');if(confirm('Remplacer tes données actuelles par cette sauvegarde?')){state={...clone(BASE),...d};persist();render();toast('Sauvegarde importée ♡')}}catch(e){alert('Fichier de sauvegarde invalide : '+e.message)}};rd.readAsText(file)}
document.getElementById('googleConnectBtn').onclick=connectGoogleCalendar;document.getElementById('exportBtn').onclick=exportData;document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=e=>{importData(e.target.files[0]);e.target.value=''};window.addEventListener('storage',e=>{if(e.key===KEY){state=load();render()}});setInterval(timerTick,250);render();
</script></body></html>
